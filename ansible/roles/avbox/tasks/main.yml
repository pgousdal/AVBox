---
- name: Assert Debian 13 target
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == '13'
    fail_msg: AVBox M1 provisioning supports Debian 13 only

- name: Install application and qualified Debian detector dependencies
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-packaging
      - b3sum
      - bubblewrap
      - file
      - libmagic1
      - libimage-exiftool-perl
      - ssdeep
      - clamav
      - clamav-freshclam
      - yara
      - chkrootkit
      - rkhunter
    state: present
    update_cache: true

- name: Create AVBox group
  ansible.builtin.group:
    name: "{{ avbox_group }}"
    system: true

- name: Create AVBox service account
  ansible.builtin.user:
    name: "{{ avbox_user }}"
    group: "{{ avbox_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ avbox_state_root }}"
    create_home: false

- name: Create AVBox state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ avbox_user }}"
    group: "{{ avbox_group }}"
    mode: '0700'
  loop:
    - "{{ avbox_state_root }}"
    - "{{ avbox_state_root }}/staging"
    - "{{ avbox_state_root }}/jobs"
    - "{{ avbox_state_root }}/quarantine"
    - "{{ avbox_state_root }}/scratch"
    - "{{ avbox_state_root }}/raw-output"
    - "{{ avbox_state_root }}/rab-uploads"
    - "{{ avbox_state_root }}/rab-export"

- name: Create controlled rules directory
  ansible.builtin.file:
    path: "{{ avbox_config_root }}/rules"
    state: directory
    owner: root
    group: "{{ avbox_group }}"
    mode: '0750'

- name: Create configuration directory
  ansible.builtin.file:
    path: "{{ avbox_config_root }}"
    state: directory
    owner: root
    group: "{{ avbox_group }}"
    mode: '0750'

- name: Create application source directory
  ansible.builtin.file:
    path: "{{ avbox_install_root }}/source"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy AVBox package metadata
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: "{{ avbox_install_root }}/source/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - pyproject.toml
    - README.md
    - LICENSE
  register: avbox_metadata_copy
  notify: Restart avbox

- name: Copy AVBox Python package
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../src/"
    dest: "{{ avbox_install_root }}/source/src/"
    owner: root
    group: root
    mode: preserve
  notify: Restart avbox
  register: avbox_source_copy

- name: Create application virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ avbox_install_root }}/venv"
    creates: "{{ avbox_install_root }}/venv/bin/python"
  register: avbox_venv_create

- name: Install AVBox package
  ansible.builtin.pip:
    name: "{{ avbox_install_root }}/source"
    virtualenv: "{{ avbox_install_root }}/venv"
    editable: true
  when: avbox_venv_create.changed or avbox_metadata_copy.changed or avbox_source_copy.changed
  notify: Restart avbox

- name: Install production configuration
  ansible.builtin.template:
    src: avbox.yaml.j2
    dest: "{{ avbox_config_root }}/avbox.yaml"
    owner: root
    group: "{{ avbox_group }}"
    mode: '0640'
  notify: Restart avbox

- name: Require an external RAB token file when protocol is enabled
  ansible.builtin.assert:
    that:
      - avbox_rab_token_file | length > 0
    fail_msg: Set avbox_rab_token_file to a controller-side mode-0600 token file
  when: avbox_rab_protocol_enabled | bool

- name: Install RAB client credential outside Git
  ansible.builtin.copy:
    content: "{{ {'clients': [{'client_id': 'rab', 'token': lookup('file', avbox_rab_token_file), 'scopes': ['analysis.submit', 'analysis.read', 'capabilities.read']}]} | to_nice_json }}\n"
    dest: "{{ avbox_config_root }}/rab-clients.json"
    owner: root
    group: "{{ avbox_group }}"
    mode: '0640'
  no_log: true
  notify: Restart avbox
  when: avbox_rab_protocol_enabled | bool

- name: Install registry
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../config/registry/registry.yaml"
    dest: "{{ avbox_config_root }}/registry.yaml"
    owner: root
    group: "{{ avbox_group }}"
    mode: '0640'
  notify: Restart avbox

- name: Install versioned analysis profiles
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../config/analysis-profiles.yaml"
    dest: "{{ avbox_config_root }}/analysis-profiles.yaml"
    owner: root
    group: "{{ avbox_group }}"
    mode: '0640'
  notify: Restart avbox

- name: Install controlled M1 YARA qualification rules
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../config/rules/avbox-m1.yar"
    dest: "{{ avbox_config_root }}/rules/avbox-m1.yar"
    owner: root
    group: "{{ avbox_group }}"
    mode: '0640'
  notify: Restart avbox

- name: Install hardened systemd unit
  ansible.builtin.template:
    src: avbox.service.j2
    dest: /etc/systemd/system/avbox.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart avbox

- name: Enable and start AVBox
  ansible.builtin.systemd_service:
    name: avbox
    enabled: true
    state: started
    daemon_reload: true
