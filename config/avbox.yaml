paths:
  state: /tmp/avbox-m0/state
  staging: /tmp/avbox-m0/staging
  jobs: /tmp/avbox-m0/jobs
  quarantine: /tmp/avbox-m0/quarantine
  scratch: /tmp/avbox-m1/scratch
  raw_output: /tmp/avbox-m1/raw-output
  rules: config/rules
  registry: config/registry/registry.yaml
storage:
  sqlite_path: /tmp/avbox-m0/state/avbox.db
  clean_bytes_retention_hours: 0
  minimum_free_gib: 5
quarantine:
  enabled: true
  content_addressed: true
  immutable_after_admission: true
runtime:
  worker_concurrency: 2
  default_timeout_seconds: 300
  memory_limit_mib: 1536
  maximum_file_bytes: 1073741824
  use_bubblewrap: true
  default_file_detectors: [clamav, yara, yara-x, loki, maldet]
  max_recursion_depth: 3
  max_children_per_object: 100
  max_total_children: 1000
  max_single_child_bytes: 67108864
  max_total_extracted_bytes: 536870912
  max_expansion_ratio: 100.0
  max_member_name_bytes: 4096
  max_path_depth: 32
  max_extraction_time_seconds: 300
  max_partitions_per_disk: 32
  max_materialized_partition_bytes: 268435456
  max_total_materialized_partition_bytes: 536870912
api:
  host: 127.0.0.1
  port: 8080
  explicit_lan_exposure: false
web:
  enabled: true
logging:
  level: INFO
  json: true
preservation:
  external_manifests_enabled: true
  bootstrap_import_enabled: true
rab:
  enabled: false
  endpoint: null
  export_directory: /tmp/avbox-m0/rab-export
rab_protocol:
  enabled: false
  credential_file: /tmp/avbox-m1/rab-clients.json
  profiles_file: config/analysis-profiles.yaml
  upload_root: /tmp/avbox-m1/rab-uploads
  maximum_upload_bytes: 1073741824
  queue_capacity: 16
  worker_concurrency: 1
