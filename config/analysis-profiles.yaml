schema_version: 1
profiles:
  - id: security-default
    version: 1
    analyzers: [clamav, yara]
    capabilities: [security_detection]
    enabled: true
  - id: identification-default
    version: 1
    analyzers: [identity, basic-metadata, file-type]
    capabilities: [object_identity, file_type, basic_metadata]
    enabled: true
  - id: static-default
    version: 1
    analyzers: [identity, basic-metadata, file-type, strings, byte-statistics, generic-metadata, similarity]
    capabilities: [object_identity, static_characteristics, similarity_fingerprint]
    enabled: true
  - id: recursive-default
    version: 1
    analyzers: [identity, basic-metadata, file-type, strings, byte-statistics, generic-metadata, similarity, executable, document, clamav, yara, container]
    capabilities: [object_identity, static_characteristics, executable_structure, document_structure, security_detection, container_discovery, recursive_analysis]
    enabled: true
  - id: executable-default
    version: 1
    analyzers: [identity, basic-metadata, file-type, strings, byte-statistics, executable]
    capabilities: [object_identity, file_type, static_characteristics, executable_structure]
    enabled: true
  - id: document-default
    version: 1
    analyzers: [identity, basic-metadata, file-type, strings, byte-statistics, generic-metadata, similarity, document]
    capabilities: [object_identity, file_type, static_characteristics, document_structure]
    enabled: true
  - id: preservation-validation
    version: 1
    analyzers: [identity, basic-metadata, file-type, structural-validator, container]
    capabilities: [object_identity, file_type, basic_metadata, structural_validation, recursive_analysis]
    enabled: true
  - id: correlation-default
    version: 1
    analyzers: [identity, basic-metadata, file-type, similarity, container, rab-correlation]
    capabilities: [object_identity, similarity_fingerprint, recursive_analysis, rab_exact_correlation, rab_occurrence_correlation, rab_similarity_correlation]
    enabled: true
