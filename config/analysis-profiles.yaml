schema_version: 1
profiles:
  - id: security-default
    version: 1
    analyzers: [clamav, yara]
    capabilities: [security_detection]
    enabled: true
  - id: identification-default
    version: 1
    analyzers: [identity, basic-metadata, file-type]
    capabilities: [object_identity, file_type, basic_metadata]
    enabled: true
  - id: static-default
    version: 1
    analyzers: [identity, basic-metadata, file-type, strings, byte-statistics, generic-metadata, similarity]
    capabilities: [object_identity, static_characteristics, similarity_fingerprint]
    enabled: true
  - id: recursive-default
    version: 1
    analyzers: [identity, basic-metadata, file-type, strings, byte-statistics, generic-metadata, similarity, clamav, yara, container]
    capabilities: [object_identity, static_characteristics, security_detection, container_discovery, recursive_analysis]
    enabled: true
